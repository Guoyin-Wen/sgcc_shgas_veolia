name: Auto Merge Upstream (sgcc_electricity_new)

# 上游 ARC-MX/sgcc_electricity_new (master) 更新后自动合并到本仓库 main
# 冲突时本 workflow 会失败并邮件通知，需本地手动解决后再推送
on:
  schedule:
    - cron: '30 1 * * *'  # 每天 UTC 1:30（北京时间 9:30），避开整点高峰
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-merge-upstream
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge arc/master into main
        run: |
          set -e
          git remote add arc https://github.com/ARC-MX/sgcc_electricity_new.git
          git fetch arc master

          if git merge-base --is-ancestor arc/master HEAD; then
            echo "上游无新提交，无需合并"
            exit 0
          fi

          git merge arc/master --no-edit -m "同步上游 ARC-MX/sgcc_electricity_new"
          git push origin main
          echo "已合并并推送：$(git log --oneline -1)"
