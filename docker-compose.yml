services:
  sgcc_electricity_app:
    env_file:
      - .env
    build: .                          # 本地构建，功能与仓库最新代码一致（README 推荐方式）
    image: sgcc_shgas_veolia:local
    # image: xudingjun3131/sgcc_shgas_veolia:v1.0  # 弃坑上游冻结镜像，不含 MQTT discovery/长期统计等新功能
    container_name: sgcc_shgas_veolia
    network_mode: "host"
    environment:
      - SET_CONTAINER_TIMEZONE=true
      - CONTAINER_TIMEZONE=Asia/Shanghai
    restart: unless-stopped
    volumes:
      - ./:/data        # if you want to read homeassistant.db, homeassistant.db is in the container at /data/
    command: python3 main.py
    init: true
